name: CI

# Trigger the workflow on push or pull request, but only for the main branch
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  cabal:
    name: ${{ matrix.os }} / ghc ${{ matrix.ghc }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        cabal: ["3.16.1.0"]
        ghc: ["9.8.4", "9.10.3", "9.12.4", "9.14.1"]

    steps:
    - uses: actions/checkout@v3
      if: github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.ref == 'refs/heads/main'

    - uses: haskell-actions/setup@v2
      id: setup-haskell-cabal
      name: Setup Haskell
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: ${{ matrix.cabal }}
    - name: Prepare environment
      run: .github/workflows/setup_ci_env.sh

    - name: Freeze
      run: |
        cabal freeze
 
    - uses: actions/cache@v3
      name: Cache ~/.cabal/store and .ghcup
      with:
        path: |
          ${{ steps.setup-haskell-cabal.outputs.cabal-store }}
          .ghcup
        key: ${{ runner.os }}-${{ matrix.ghc }}-${{ hashFiles('cabal.project.freeze') }}

    - name: Build
      run: |
        cp .cabal.project.local cabal.project.local
        cabal configure --enable-tests --test-show-details=direct --disable-optimization
        cabal build all
    - name: Test
      run: |
        cabal test all

  licenses:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      DASH_VERSION: 1.1.0
      DASH_SHA256: ba4e84e1981f0e51f92a42ec8fc8b9668dabb08d1279afde46b8414e11752b06

    steps:
    - uses: actions/checkout@v4
    - uses: haskell-actions/setup@v2
      name: Setup Haskell
      with:
        ghc-version: "9.14.1"
        cabal-version: "3.16.1.0"
    - name: Freeze
      run: |
        cabal freeze
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21
    - name: Cache the Eclipse Dash license tool
      id: dash-cache
      uses: actions/cache@v4
      with:
        path: dash-licenses.jar
        key: dash-licenses-${{ env.DASH_VERSION }}
    - name: Download the Eclipse Dash license tool
      if: steps.dash-cache.outputs.cache-hit != 'true'
      run: |
        curl -fsSL -o dash-licenses.jar \
          https://clementd-files.cellar-c2.services.clever-cloud.com/org.eclipse.dash.licenses-$DASH_VERSION.jar
    - name: Verify the Eclipse Dash license tool
      run: echo "$DASH_SHA256  dash-licenses.jar" | sha256sum -c
    - name: Check dependency licenses
      # the tool exits with the number of dependencies that are not approved
      shell: bash
      run: |
        grep '==' cabal.project.freeze \
          | sed -E \
            -e 's|constraints: | |' \
            -e 's|,$||' \
            -e 's|^ +|haskell/hackage/-/|' \
            -e 's| ==|/|' \
            -e 's|/any\.|/|' \
          | java -jar dash-licenses.jar -summary DEPENDENCIES -
    - name: Upload the license summary
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: dependencies-licenses
        path: DEPENDENCIES
